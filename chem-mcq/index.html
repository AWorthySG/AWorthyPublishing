header{background:#1b2a4a;color:#fff;padding:20px 16px}

main{padding:20px 16px 40px}
.view{display:none}.view.show{display:block}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.pc{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;color:inherit;font:inherit}
.pc:hover{border-color:var(--brand)}
.pc h3{margin:0 0 2px;font-size:18px}.pc p{margin:0;color:var(--mute);font-size:14px}
.pc .st{margin-top:10px;font-weight:800;font-size:14px;color:var(--brand)}
.intro{margin:0 0 16px;color:var(--mute)}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;scroll-margin-top:60px}
.qh{display:flex;gap:12px}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--sel);color:var(--brand);font-weight:800;display:grid;place-items:center;font-size:14px}
.stem{flex:1;min-width:0}
.fig{margin:12px 0;background:#fff;border-radius:8px;padding:8px;text-align:center;border:1px solid var(--line)}
.fig img{max-width:100%;height:auto}
.tw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;font-size:14px;min-width:100%}
td,th{border:1px solid var(--line);padding:6px 8px;text-align:center}
th{background:var(--sel)}
.eq{display:block;text-align:center;margin:8px 0;font-weight:600}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:inherit;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--brand)}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--mute);display:grid;place-items:center;font-size:13px}
.opt.on{background:var(--sel);border-color:var(--brand)}
.opt.on b{background:var(--brand);border-color:var(--brand);color:var(--card)}
.pdone .opt{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--ok)}

.tag.ok{color:var(--ok)}.tag.no{color:var(--bad)}

.pnav button.cur{border-color:var(--brand);background:var(--brand);color:var(--card)}
.pnav button.ok::after{content:" \2713"}
.alert{display:none;border:2px solid var(--bad);background:var(--badbg);border-radius:12px;padding:14px 16px;margin-bottom:16px;scroll-margin-top:60px}
.alert.good{border-color:var(--ok);background:var(--okbg)}
.alert h3{margin:0 0 6px;font-size:17px}.alert p{margin:0}
.alert a{display:inline-grid;place-items:center;min-width:32px;height:32px;margin:6px 6px 0 0;border-radius:8px;background:var(--bad);color:#fff;font-weight:800;text-decoration:none}
.navrow{display:flex;gap:10px;margin-top:12px}.navrow .ghost{flex:1}
.ghost{background:transparent;border:1.5px solid var(--brand);color:var(--brand);padding:10px 18px;border-radius:10px;font:700 15px Nunito,sans-serif;cursor:pointer}

.result .big{font-size:48px;font-weight:800;color:var(--brand)}

.g1{background:var(--ok)}.g0{background:var(--bad)}.gx{background:var(--mute)}

  home.innerHTML=header('O-Level Chemistry 6092 · Paper 1','Preliminary Examination Papers',`${M.length} papers · ${YEARS.length} years · 40 multiple-choice questions each`)+
  `<main><div class="wrap"><div class="years">${YEARS.map(y=>`<button class="${y===year?'cur':''}" onclick="setYear(${y})">${y}</button>`).join('')}</div>
  <p class="intro">${year}: ${list.length} paper${list.length>1?'s':''}. Each paper is split into four pages of ten questions. Submit each page to see which questions you got wrong.</p><div class="cards">${list.map(([m,k])=>{
    const s=st[k];let lab='Not started';
    if(s){const done=Object.keys(s.sub).length,ans=Object.keys(s.ans).length;
      if(done===NP)lab='Score: '+score(k)+' / 40';else if(ans||done)lab=`In progress · ${done} of 4 pages submitted`;}
    return `<button class="pc" onclick="openPaper(${k},0)"><h3>${esc(m.school)}</h3><p>${m.year} ${esc(m.exam)}</p><div class="st">${lab}</div></button>`;}).join('')}</div></div></main>`+FOOT;
}
function build(k){
  const p=P[k];st[k]={ans:{},sub:{}};
  for(let g=0;g<NP;g++){
  const pg=document.createElement('div');pg.className='view';pg.id=`v${k}-${g}`;
  pg.innerHTML=header(`O-Level Chemistry 6092 · Paper 1 · Page ${g+1} of 4`,`${p.year} ${esc(p.exam)}: ${esc(p.school)}`,`Questions ${g*PER+1}–${g*PER+PER} · 1 mark each`)+
   `<div class="bar"><div class="wrap"><button class="back" onclick="goHome()">← All papers</button><div class="prog"><i></i></div><span class="cnt"></span></div></div>
   <main><div class="wrap"><div class="pnav"></div><div class="result"></div><div class="alert" role="alert" tabindex="-1"></div><div class="qs"></div>
   <button class="submit">Submit page ${g+1}</button><div class="navrow"></div></div></main>`+FOOT;
  app.appendChild(pg);
  const qs=pg.querySelector('.qs');
  for(let i=g*PER;i<g*PER+PER;i++){const q=p.questions[i];
    const fh=f=>`<div class="fig"><img src="${f}" alt="Diagram for question ${i+1}" loading="lazy"></div>`;const used=new Set();
    const stem=q.s.replace(/\{fig(\d+)\}/g,(m,n)=>{const f=(q.figs||[])[n-1];if(!f)return '';used.add(n-1);return fh(f);});
    const figs=(q.figs||[]).filter((_,j)=>!used.has(j)).map(fh).join('');
    const el=document.createElement('section');el.className='q';el.id=`q${k}-${i+1}`;
    el.innerHTML=`<div class="qh"><div class="num">${i+1}</div><div class="stem">${q.figpos==='before'?figs+stem:stem+figs}<div class="opts">${q.o.map((o,j)=>`<button class="opt" data-l="${L[j]}"><b>${L[j]}</b><span>${o}</span></button>`).join('')}</div><div class="tag"></div><div class="rw"><span>Rough working</span><button type="button">More space</button></div></div></div><div class="qf"><img src="${NIB}" alt="A-Worthy fountain pen nib logo"><span>A-Worthy Education · Telegram @telephonemepls · WhatsApp 8991 3181<br>© 2026 A-Worthy Education. All rights reserved. No part of this material may be reproduced, distributed or transmitted in any form or by any means without the prior written permission of A-Worthy Education.</span></div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(st[k].sub[g])return;st[k].ans[i]=b.dataset.l;el.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));upd(k);});
    const rw=el.querySelector('.rw'),rk=M[k].file+'#'+el.id;rw.style.minHeight=(180+(INK.space[rk]||0))+'px';
    rw.querySelector('button').onclick=()=>{INK.space[rk]=(INK.space[rk]||0)+180;rw.style.minHeight=(180+INK.space[rk])+'px';inkSave();};
    qs.appendChild(el);}
  const btn=pg.querySelector('.submit');btn.onclick=()=>submitPage(k,g,btn);}
  built[k]=true;upd(k);
}
async function openPaper(k,g){
  if(!built[k]){
    load.innerHTML=header('O-Level Chemistry 6092 · Paper 1',esc(M[k].school),'Loading paper…')+'<div class="loading">Loading questions and diagrams…</div>'+FOOT;show('load');
    try{const r=await fetch(M[k].file);if(!r.ok)throw new Error(r.status);P[k]=await r.json();build(k);}
    catch(e){load.querySelector('.loading').innerHTML='This paper could not be loaded. Check your connection and <button class="ghost" onclick="openPaper('+k+','+g+')">try again</button>';return;}
  }
  show(`v${k}-${g}`);
}
function nAns(k,g){let n=0;for(let i=g*PER;i<g*PER+PER;i++)if(st[k].ans[i])n++;return n;}
function upd(k){const tot=Object.keys(st[k].ans).length;
  for(let g=0;g<NP;g++){const pg=document.getElementById(`v${k}-${g}`);
    pg.querySelector('.prog i').style.width=(nAns(k,g)/PER*100)+'%';
    pg.querySelector('.cnt').textContent=`${nAns(k,g)} / ${PER} · ${tot} / 40`;
    pg.querySelector('.pnav').innerHTML=[...Array(NP)].map((_,x)=>`<button class="${x===g?'cur':''} ${st[k].sub[x]?'ok':''}" onclick="openPaper(${k},${x})">Page ${x+1}</button>`).join('');
    pg.querySelector('.navrow').innerHTML=(g>0?`<button class="ghost" onclick="openPaper(${k},${g-1})">Previous page</button>`:`<button class="ghost" onclick="goHome()">All papers</button>`)+(g<NP-1?`<button class="ghost" onclick="openPaper(${k},${g+1})">Next page</button>`:`<button class="ghost" onclick="goHome()">All papers</button>`);}}
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('show',v.id===id));window.scrollTo(0,0);inkShow(id);}
function goHome(){renderHome();show('home');}
function jump(k,i){openPaper(k,Math.floor(i/PER));setTimeout(()=>document.getElementById(`q${k}-${i+1}`).scrollIntoView(),30);return false;}
function submitPage(k,g,btn){
  const s=st[k];if(s.sub[g])return;
  const n=nAns(k,g);
  if(n<PER&&!btn.dataset.warn){btn.dataset.warn=1;btn.textContent=`${PER-n} unanswered on this page. Press again to submit anyway`;return;}
  s.sub[g]=true;const pg=document.getElementById(`v${k}-${g}`);pg.classList.add('pdone');
  const wrong=[];let sc=0;
  for(let i=g*PER;i<g*PER+PER;i++){const ak=P[k].key[i],a=s.ans[i],ok=okAns(k,i,a),el=document.getElementById(`q${k}-${i+1}`);
    if(ok)sc++;else wrong.push(i);
    el.querySelectorAll('.opt').forEach(b=>{b.classList.remove('on');if(b.dataset.l===ak||(P[k].questions[i].alt||'').includes(b.dataset.l))b.classList.add('right');else if(b.dataset.l===a)b.classList.add('wrong');});
    const t=el.querySelector('.tag');t.className='tag '+(ok?'ok':'no');const acc=ak+(P[k].questions[i].alt?' or '+P[k].questions[i].alt:'');t.textContent=ok?'Correct':(a?`Your answer: ${a} · Correct answer: ${acc}`:`Not answered · Correct answer: ${acc}`);}
  const al=pg.querySelector('.alert');al.style.display='block';
  if(wrong.length){al.className='alert';al.innerHTML=`<h3>Page ${g+1}: ${sc} / ${PER}. Check ${wrong.length===1?'this question':'these '+wrong.length+' questions'}:</h3><p>${wrong.map(w=>`<a href="#" onclick="return jump(${k},${w})">${w+1}</a>`).join('')}</p>`;}
  else{al.className='alert good';al.innerHTML=`<h3>Page ${g+1}: ${sc} / ${PER}. All correct.</h3>`;}
  btn.textContent=g<NP-1?`Page ${g+1} submitted · go to page ${g+2}`:'Page 4 submitted';
  btn.onclick=()=>{if(g<NP-1)openPaper(k,g+1);};
  if(Object.keys(s.sub).length===NP)final(k);
  upd(k);al.scrollIntoView({behavior:'smooth',block:'start'});al.focus({preventScroll:true});
}
function final(k){
  const s=st[k];let cells='';
  P[k].key.split('').forEach((ak,i)=>{const a=s.ans[i];cells+=`<a href="#" onclick="return jump(${k},${i})" class="${a?(okAns(k,i,a)?'g1':'g0'):'gx'}">${i+1}</a>`;});
  const sc=score(k),r=document.querySelector(`#v${k}-3 .result`);r.style.display='block';
  r.innerHTML=`<img src="${CELEB}" alt=""><div>Overall score: ${esc(P[k].school)}</div><div class="big">${sc} / 40</div><div>${Math.round(sc/40*100)}%</div><div class="grid">${cells}</div><button class="ghost" onclick="resetPaper(${k})">Try this paper again</button>`+summary(k);
}
function qFull(k,i){const q=P[k].questions[i];const fh=f=>`<div class="fig"><img src="${f}" alt="Diagram for question ${i+1}"></div>`;const used=new Set();
  const stem=q.s.replace(/\{fig(\d+)\}/g,(m,n)=>{const f=(q.figs||[])[n-1];if(!f)return '';used.add(n-1);return fh(f);});
  const figs=(q.figs||[]).filter((_,j)=>!used.has(j)).map(fh).join('');return q.figpos==='before'?figs+stem:stem+figs;}
function summary(k){const s=st[k],p=P[k],wrong=[];for(let i=0;i<40;i++)if(!okAns(k,i,s.ans[i]))wrong.push(i);
  const opt=(i,l)=>`${l}: ${p.questions[i].o[L.indexOf(l)]}`;
  const items=wrong.map(i=>{const a=s.ans[i],q=p.questions[i],acc=[p.key[i],...(q.alt||'').split('').filter(Boolean)];
    return `<div class="sq"><h3>Question ${i+1}</h3>${qFull(k,i)}<div class="ans"><div class="yours">Your answer: ${a?opt(i,a):'not answered'}</div>${acc.map(l=>`<div class="right">Correct answer: ${opt(i,l)}</div>`).join('')}</div></div>`;}).join('');
  return `<div class="sum" id="sum${k}"><h2>Questions you got wrong (${wrong.length})</h2>`+
   (wrong.length?`<div class="sumtip"><b>Keep a copy of this summary.</b><ol><li>Take screenshots of this section, from this box down to the last question, or</li><li>press <b>Save as PDF</b> below. In the window that opens, choose <b>Save as PDF</b> (on iPad: tap <b>Share</b> or <b>Options</b>, then <b>Save to Files</b>).</li></ol></div><button class="sumbtn" onclick="saveSum(${k})">Save as PDF</button>${items}`:'<p class="sumnone">You answered every question correctly.</p>')+'</div>';}
function saveSum(k){const ps=document.getElementById('psum'),p=P[k];
  ps.innerHTML=header('O-Level Chemistry 6092 · Paper 1 · Review',`${p.year} ${esc(p.exam)}: ${esc(p.school)}`,`Score: ${score(k)} / 40`)+'<main><div class="wrap">'+document.getElementById('sum'+k).innerHTML+'</div></main>'+FOOT;
  const th=document.documentElement.dataset.theme;document.documentElement.dataset.theme='light';document.body.classList.add('printsum');const done=()=>{document.body.classList.remove('printsum');if(th)document.documentElement.dataset.theme=th;else delete document.documentElement.dataset.theme;ps.innerHTML='';removeEventListener('afterprint',done);};
  addEventListener('afterprint',done);setTimeout(()=>{window.print();},50);}
function resetPaper(k){
  st[k]={ans:{},sub:{}};
  for(let g=0;g<NP;g++){const pg=document.getElementById(`v${k}-${g}`);pg.classList.remove('pdone');
    pg.querySelector('.alert').style.display='none';pg.querySelector('.result').style.display='none';
    const b=pg.querySelector('.submit');delete b.dataset.warn;b.textContent=`Submit page ${g+1}`;b.onclick=()=>submitPage(k,g,b);
    pg.querySelectorAll('.opt').forEach(o=>o.className='opt');pg.querySelectorAll('.tag').forEach(t=>{t.className='tag';t.textContent='';});}
  upd(k);openPaper(k,0);
}

/* ---- Stylus annotation ---- */
const INK={space:{},on:false,tool:'pen',col:'#1d2433',strokes:{},hist:[],cur:null};
const tbEl=document.getElementById('tb');
function inkKey(id){const k=+id.slice(1).split('-')[0];return M[k].file+'#'+id;}
function inkSave(){try{localStorage.setItem('aw-chem-ink',JSON.stringify(INK.strokes));localStorage.setItem('aw-chem-space',JSON.stringify(INK.space));}catch(e){}}
try{INK.strokes=JSON.parse(localStorage.getItem('aw-chem-ink')||'{}')||{};INK.space=JSON.parse(localStorage.getItem('aw-chem-space')||'{}')||{};}catch(e){INK.strokes={};INK.space={};}
function inkCanvas(q){let c=q.querySelector(':scope>canvas.ink');if(!c){c=document.createElement('canvas');c.className='ink';q.appendChild(c);
  new ResizeObserver(()=>inkDraw(q)).observe(q);}return c;}
function inkDraw(q){const has=(INK.strokes[inkKey(q.id)]||[]).length;if(!has&&!q.querySelector(':scope>canvas.ink'))return;const c=inkCanvas(q),w=q.offsetWidth,h=q.offsetHeight,d=window.devicePixelRatio||1;
  if(!w)return;c.width=w*d;c.height=h*d;c.style.width=w+'px';c.style.height=h+'px';
  const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);
  (INK.strokes[inkKey(q.id)]||[]).forEach(s=>inkStroke(x,s,w));}
function inkStroke(x,s,w){const p=s.p;x.save();x.lineCap='round';x.lineJoin='round';x.strokeStyle=s.c;
  if(s.h){x.globalAlpha=.3;x.globalCompositeOperation='multiply';}
  if(s.h&&p.length>1){x.beginPath();x.lineWidth=s.w*w/700;x.moveTo(p[0][0]*w,p[0][1]*w);for(let i=1;i<p.length;i++)x.lineTo(p[i][0]*w,p[i][1]*w);x.stroke();x.restore();return;}
  for(let i=1;i<p.length;i++){x.beginPath();x.lineWidth=s.w*w/700*(s.h?1:(.45+(p[i][2]||.5)*1.1));
    x.moveTo(p[i-1][0]*w,p[i-1][1]*w);x.lineTo(p[i][0]*w,p[i][1]*w);x.stroke();}
  if(p.length===1){x.beginPath();x.fillStyle=s.c;x.arc(p[0][0]*w,p[0][1]*w,s.w*w/1400,0,7);x.fill();}x.restore();}
function inkPt(q,e){const r=q.getBoundingClientRect(),w=q.offsetWidth;return[(e.clientX-r.left)/w,(e.clientY-r.top)/w,e.pressure||.5];}
function inkErase(q,pt){const key=inkKey(q.id),a=INK.strokes[key]||[],r=.025;
  const keep=a.filter(s=>!s.p.some(p=>Math.hypot(p[0]-pt[0],p[1]-pt[1])<r));
  if(keep.length!==a.length){INK.hist.push({key,prev:a});INK.strokes[key]=keep;inkDraw(q);inkSave();}}
function drawable(e){return INK.on&&(e.pointerType==='pen'||e.pointerType==='mouse');}
document.addEventListener('pointerdown',e=>{const q=e.target.closest&&e.target.closest('.view.show .q');if(!q||!drawable(e)||e.target.closest('.rw button'))return;
  e.preventDefault();e.stopPropagation();INK.justDrew=true;const pt=inkPt(q,e);
  if(INK.tool==='er'){INK.cur={q,er:true};inkErase(q,pt);return;}
  const s={c:INK.col,w:INK.tool==='hl'?22:3,h:INK.tool==='hl',p:[pt]};INK.cur={q,s};
  const key=inkKey(q.id);(INK.strokes[key]=INK.strokes[key]||[]).push(s);INK.hist.push({key,add:s});inkDraw(q);
  try{q.setPointerCapture(e.pointerId);}catch(_){}},true);
document.addEventListener('pointermove',e=>{const c=INK.cur;if(!c)return;e.preventDefault();
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  if(c.er){inkErase(c.q,inkPt(c.q,e));return;}
  evs.forEach(v=>c.s.p.push(inkPt(c.q,v)));if(c.s.h){inkDraw(c.q);return;}
  const x=inkCanvas(c.q).getContext('2d'),p=c.s.p;inkStroke(x,{...c.s,p:p.slice(-evs.length-1)},c.q.offsetWidth);},true);
function inkEnd(){if(INK.cur){INK.cur=null;inkSave();}setTimeout(()=>INK.justDrew=false,60);}
document.addEventListener('pointerup',inkEnd,true);document.addEventListener('pointercancel',inkEnd,true);
document.addEventListener('click',e=>{if(INK.on&&INK.justDrew){e.preventDefault();e.stopPropagation();}},true);
/* stop the Apple Pencil from scrolling the page while drawing; fingers still scroll */
['touchstart','touchmove'].forEach(t=>document.addEventListener(t,e=>{if(INK.on&&[...e.touches].some(x=>x.touchType==='stylus')&&e.target.closest&&e.target.closest('.q'))e.preventDefault();},{passive:false}));
function inkSetOn(v){INK.on=v;document.body.classList.toggle('inkon',v);tbEl.classList.toggle('open',v);
  const b=document.getElementById('tbMain');b.textContent=v?'Pen: on':'Pen: off';b.setAttribute('aria-pressed',v);}
document.getElementById('tbMain').onclick=()=>inkSetOn(!INK.on);
tbEl.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{INK.col=b.dataset.c;tbEl.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b));if(INK.tool==='er')tbEl.querySelector('[data-t=pen]').click();});
tbEl.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{INK.tool=b.dataset.t;tbEl.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));});
document.getElementById('tbUndo').onclick=()=>{const h=INK.hist.pop();if(!h)return;
  if(h.add){const a=INK.strokes[h.key]||[];const i=a.lastIndexOf(h.add);if(i>=0)a.splice(i,1);}else INK.strokes[h.key]=h.prev;
  const q=document.getElementById(h.key.split('#')[1]);if(q)inkDraw(q);inkSave();};
document.getElementById('tbClr').onclick=()=>{const v=document.querySelector('.view.show');if(!v)return;
  v.querySelectorAll('.q').forEach(q=>{const key=inkKey(q.id);if((INK.strokes[key]||[]).length){INK.hist.push({key,prev:INK.strokes[key]});INK.strokes[key]=[];inkDraw(q);}});inkSave();};
function inkShow(id){document.querySelectorAll('.view:not(.show) canvas.ink').forEach(c=>{c.width=c.height=0;});const quiz=/^v\d+-\d+$/.test(id);tbEl.classList.toggle('vis',quiz);if(!quiz){inkSetOn(false);return;}
  document.getElementById(id).querySelectorAll('.q').forEach(inkDraw);}

/* ---- Copy deterrents ---- */
['contextmenu','copy','cut','dragstart','selectstart'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&['c','x','s','p','u','a'].includes(k)){e.preventDefault();}
  if(k==='printscreen'){try{navigator.clipboard.writeText('© A-Worthy Education. Reproduction not permitted.');}catch(_){}}});
goHome();
</script>
